<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vtex-inspector</title>
    <script>
      (function () {
        var stored = localStorage.getItem("@sds.vtex-inspector.theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <script type="module" crossorigin src="/assets/popup-DPxubnCc.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/popup-DXfBxK4W.css">
  </head>

  <body>
    <div id="root"></div>
    
  </body>
</html>
